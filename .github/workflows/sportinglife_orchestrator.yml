name: SportingLife Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: write
  actions: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Log orchestrator trigger context
        run: echo "event=${{ github.event_name }} schedule=${{ github.event.schedule }} actor=${{ github.actor }} run=${{ github.run_id }} ref=${{ github.ref }}"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next shard
        id: compute
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const totalShards = 3;
          const shards = Array.from({ length: totalShards }, (_, index) => index + 1);
          const statePath = path.join('public', 'sportinglife', '_orchestrator_state.json');

          console.log(`Dispatching shards: ${shards.join(', ')}`);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `shards=${JSON.stringify(shards)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `state_path=${statePath}\n`);
          NODE

      - name: Dispatch shard workflows
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const shards = JSON.parse('${{ steps.compute.outputs.shards }}');
            for (const shard of shards) {
              const workflowFile = `sportinglife_shard_${shard}.yml`;
              core.info(`Dispatching shard workflow: ${workflowFile}`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowFile,
                ref: context.ref,
                inputs: {}
              });
            }

      - name: Update orchestrator state
        env:
          SHARDS: ${{ steps.compute.outputs.shards }}
          STATE_PATH: ${{ steps.compute.outputs.state_path }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const statePath = process.env.STATE_PATH || path.join('public', 'sportinglife', '_orchestrator_state.json');
          fs.mkdirSync(path.dirname(statePath), { recursive: true });
          const shards = JSON.parse(process.env.SHARDS || '[]');
          const data = {
            lastShard: shards.length ? shards[shards.length - 1] : 1,
            updatedAt: new Date().toISOString()
          };
          fs.writeFileSync(statePath, JSON.stringify(data, null, 2));
          console.log(`Wrote orchestrator state to ${statePath}`);
          NODE

      - name: Commit and push state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sportinglife/_orchestrator_state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: update sportinglife orchestrator state"
            git push
          fi
